icons_format = "{icon}"

[theme]
theme = "plain"
[theme.overrides]
idle_bg = ""
idle_fg = "#cdd6f4"
info_bg = ""
info_fg = "#89b4fa"
good_bg = ""
good_fg = "#a6e3a1"
warning_bg = ""
warning_fg = "#f9e2af"
critical_bg = ""
critical_fg = "#f38ba8"
separator = ""
separator_bg = ""
separator_fg = ""

[icons]
icons = "awesome4"
[icons.overrides]
bat = ["|E|", "|_|", "|=|", "|F|"]
bat_charging = "|^| "

[[block]]
block = "custom"
command = "paru -Pw 2>/dev/null >/dev/null && echo 'Arch: News' || echo 'Tremendo'"
interval = 3600

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon root: $available.eng(w:2) "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "
full_format = " $icon Full "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
