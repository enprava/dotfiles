# Key bindings

# Start a terminal
bindsym $mod+Return exec $term

# Kill focused window
bindsym $mod+Shift+q kill

# Start your launcher
bindsym $mod+d exec $menu

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
floating_modifier $mod

# Reload the configuration file
bindsym $mod+Shift+c reload

# Exit i3 (logs you out of your X session)
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Exit i3?' -B 'Yes' 'i3-msg exit'"

### Moving around

# Move your focus around
bindsym $mod+$left focus left; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+$down focus down; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+$up focus up; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+$right focus right; exec --no-startup-id ~/.config/i3/warp_mouse


# Move the focused window with the same, but add Shift
bindsym $mod+Shift+$left move left; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+$down move down; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+$up move up; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+$right move right; exec --no-startup-id ~/.config/i3/warp_mouse

### Workspaces

# Switch to workspace
bindsym $mod+1 workspace 1; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+2 workspace 2; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+3 workspace 3; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+4 workspace 4; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+5 workspace 5; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+6 workspace 6; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+7 workspace 7; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+8 workspace 8; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+9 workspace 9; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+0 workspace 10; exec --no-startup-id ~/.config/i3/warp_mouse

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace 1; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+2 move container to workspace 2; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+3 move container to workspace 3; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+4 move container to workspace 4; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+5 move container to workspace 5; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+6 move container to workspace 6; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+7 move container to workspace 7; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+8 move container to workspace 8; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+9 move container to workspace 9; exec --no-startup-id ~/.config/i3/warp_mouse
bindsym $mod+Shift+0 move container to workspace 10; exec --no-startup-id ~/.config/i3/warp_mouse

### Layout stuff

# Split horizontal/vertical
bindsym $mod+b split h
bindsym $mod+v split v

# Switch the current container between different layout styles
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# Make the current focus fullscreen
bindsym $mod+f fullscreen

# Toggle the current focus between tiling and floating mode
bindsym $mod+Shift+space floating toggle

# Swap focus between the tiling area and the floating area
bindsym $mod+space focus mode_toggle

# Move focus to the parent container
bindsym $mod+a focus parent

### Scratchpad

# Move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
bindsym $mod+minus scratchpad show

# Screenshot with flameshot
bindsym Print exec flameshot gui

# i3lock

bindsym $mod+semicolon exec ~/.config/i3/i3lock
